name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Check exported that everything is exported
        run: |
          find src/necsuspd -maxdepth 1 -name "*.nim" -not -name import_playdate.nim \
            | cut -d/ -f3 \
            | cut -d. -f1 \
            | xargs -n1 echo export \
            | sort > /tmp/exports_expected.txt
          grep "export" src/necsuspd.nim | sort > /tmp/exports_actual.txt
          diff /tmp/exports_expected.txt /tmp/exports_actual.txt
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nim --version
      - run: nimble install --depsOnly --accept
      - run: nimble setup
      - run: nim check -d:simulator src/necsuspd.nim
      - run: nim check src/necsuspd.nim
      - run: nimble test
